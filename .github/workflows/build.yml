name: Build installers

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: Heaven-Manager-Windows
            files: release/*.exe
          - os: macos-latest
            script: dist:mac
            artifact: Heaven-Manager-Mac
            files: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
